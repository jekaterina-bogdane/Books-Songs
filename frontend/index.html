<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books &amp; Songs</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <a class="navbar-brand" href="#/">
    <span class="brand-vinyl">◉</span>
    Books<span class="brand-amp">&amp;</span>Songs
  </a>
  <div class="navbar-links">
    <a href="#/books"  class="nav-link" data-page="books">Books</a>
    <a href="#/songs"  class="nav-link" data-page="songs">Songs</a>
    <a href="#/vinyls" class="nav-link" data-page="vinyls">Vinyl Shop</a>
  </div>
  <div class="navbar-right">
    <button class="btn-icon search-toggle" title="Search" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
    <div id="auth-area"></div>
  </div>
</nav>

<!-- ── Search overlay ─────────────────────────────────────────────────────── -->
<div class="search-overlay hidden" id="search-overlay">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search books, songs, vinyl…" autocomplete="off" />
    <button class="btn-icon search-close" id="search-close">✕</button>
  </div>
  <div class="search-results" id="search-results"></div>
</div>

<!-- ── Main content ───────────────────────────────────────────────────────── -->
<main id="app"></main>

<!-- ── Audio Player ───────────────────────────────────────────────────────── -->
<div class="player hidden" id="player">
  <div class="player-art">
    <div class="player-disc" id="player-disc"></div>
  </div>
  <div class="player-info">
    <span class="player-status" id="player-status">Ready to play</span>
    <span class="player-title" id="player-title">—</span>
    <span class="player-artist" id="player-artist"></span>
    <span class="player-book" id="player-book"></span>
  </div>
  <div class="player-controls">
    <button class="btn-icon" id="btn-prev" title="Previous">⏮</button>
    <button class="btn-play" id="btn-play" title="Play/Pause">▶</button>
    <button class="btn-icon" id="btn-next" title="Next">⏭</button>
  </div>
  <div class="player-progress">
    <span class="player-time" id="time-cur">0:00</span>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="player-time" id="time-total">0:00</span>
  </div>
  <div class="player-volume">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M11 5L6 9H2v6h4l5 4V5zm8.07 1.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
    <input type="range" id="volume" min="0" max="100" value="80" />
  </div>
</div>

<audio id="audio-el" preload="none"></audio>

<!-- ── Modal ───────────────────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">Edit</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ── Toast notifications ────────────────────────────────────────────────── -->
<div class="toasts" id="toasts"></div>

<script src="/js/api.js"></script>
<script src="/js/router.js"></script>
<script src="/js/player.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
